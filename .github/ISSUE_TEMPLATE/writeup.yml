name: New write-up
description: Propose a crackme analysis or new research material
title: "[Write-up]: "
labels: ["write-up"]
body:
  - type: markdown
    attributes:
      value: "Do not attach binaries. A link to a legitimate challenge source is sufficient."
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the crackme or CTF challenge page
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Challenge proposal
        - Draft analysis
        - Correction to an existing write-up
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Architecture, tools, approach, and expected outcome
    validations:
      required: true
